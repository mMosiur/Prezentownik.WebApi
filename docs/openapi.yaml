openapi: '3.1.1'
info:
  title: Prezentownik.WebApi | v1
  version: 1.0.0
servers:
  - url: http://localhost:5000/
paths:
  /auth/register:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
  /auth/login:
    post:
      tags:
        - Auth
      parameters:
        - name: useCookies
          in: query
          schema:
            type: boolean
        - name: useSessionCookies
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
  /auth/refresh:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
  /auth/confirmEmail:
    get:
      tags:
        - Auth
      operationId: MapIdentityApi-/auth/confirmEmail
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: changedEmail
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
  /auth/resendConfirmationEmail:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendConfirmationEmailRequest'
        required: true
      responses:
        '200':
          description: OK
  /auth/forgotPassword:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
  /auth/resetPassword:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
  /auth/manage/2fa:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
  /auth/manage/info:
    get:
      tags:
        - Auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfoRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
  /auth/logout:
    post:
      tags:
        - Auth
      description: Sign the current user out and clear the auth cookie
      responses:
        '200':
          description: OK
  /auth/me:
    get:
      tags:
        - Auth
      description: Get user information
      responses:
        '200':
          description: OK
    put:
      tags:
        - Auth
      description: Update user information
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInfoRequest'
        required: true
      responses:
        '200':
          description: OK
  /user/lists:
    get:
      tags:
        - UserLists
      description: Get all user's lists
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListSummaryDto'
    post:
      tags:
        - UserLists
      description: Create a new list
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGiftListRequest'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSummaryDto'
  '/user/lists/{listId}':
    get:
      tags:
        - UserLists
      description: Edit page view
      operationId: GetListDetails
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDetailsDto'
    put:
      tags:
        - UserLists
      description: Update list info
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGiftListRequest'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSummaryDto'
    delete:
      tags:
        - UserLists
      description: Delete a list
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
        '204':
          description: No Content
  '/user/lists/{listId}/items':
    post:
      tags:
        - UserLists
      description: Add a gift item
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertItemRequest'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDto'
  '/user/lists/{listId}/items/{itemId}':
    put:
      tags:
        - UserLists
      description: Edit a gift item
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertItemRequest'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDto'
    delete:
      tags:
        - UserLists
      description: Remove a gift item
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
        '204':
          description: No Content
  '/user/lists/{listId}/items/reorder':
    put:
      tags:
        - UserLists
      description: Reorder list items
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderItemsRequest'
        required: true
      responses:
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDetailsDto'
  '/lists/{listId}':
    get:
      tags:
        - Public
      description: View list & items
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicListDto'
  '/lists/{listId}/items/{itemId}/claims':
    post:
      tags:
        - Public
      description: Claim a gift
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimRequest'
        required: true
      responses:
        '400':
          description: Bad Request
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClaimResponse'
        '403':
          description: Forbidden
    delete:
      tags:
        - Public
      description: Unclaim a gift
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revocationToken
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '400':
          description: Bad Request
        '204':
          description: No Content
        '403':
          description: Forbidden
  /lists/claims/adopt:
    post:
      tags:
        - Public
      description: Adopt unauthenticated claims by revocation tokens for the current user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptClaimsRequest'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptClaimsResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    AccessTokenResponse:
      required:
        - accessToken
        - expiresIn
        - refreshToken
      type: object
      properties:
        tokenType:
          type:
            - 'null'
            - string
        accessToken:
          type: string
        expiresIn:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        refreshToken:
          type: string
    AdoptClaimsRequest:
      required:
        - revocationTokens
      type: object
      properties:
        revocationTokens:
          type: array
          items:
            type: string
            format: uuid
    AdoptClaimsResponse:
      required:
        - adoptedClaimsRevocationTokens
      type: object
      properties:
        adoptedClaimsRevocationTokens:
          type: array
          items:
            type: string
            format: uuid
    CreateClaimRequest:
      required:
        - quantityClaimed
        - claimantName
      type: object
      properties:
        quantityClaimed:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        claimantName:
          type:
            - 'null'
            - string
    CreateClaimResponse:
      required:
        - revocationToken
      type: object
      properties:
        revocationToken:
          type:
            - 'null'
            - string
          format: uuid
    CreateGiftListRequest:
      required:
        - name
        - description
      type: object
      properties:
        name:
          type: string
        description:
          type:
            - 'null'
            - string
    ForgotPasswordRequest:
      required:
        - email
      type: object
      properties:
        email:
          type: string
    HttpValidationProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    InfoRequest:
      type: object
      properties:
        newEmail:
          type:
            - 'null'
            - string
        newPassword:
          type:
            - 'null'
            - string
        oldPassword:
          type:
            - 'null'
            - string
    InfoResponse:
      required:
        - email
        - isEmailConfirmed
      type: object
      properties:
        email:
          type: string
        isEmailConfirmed:
          type: boolean
    ItemDto:
      required:
        - id
        - name
        - description
        - type
        - targetQuantity
        - orderNumber
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
            - 'null'
            - string
        type:
          $ref: '#/components/schemas/ItemType'
        targetQuantity:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        orderNumber:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
    ItemType:
      type: integer
    ListDetailsDto:
      required:
        - id
        - name
        - description
        - items
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
            - 'null'
            - string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemDto'
    ListSummaryDto:
      required:
        - id
        - name
        - description
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
            - 'null'
            - string
    LoginRequest:
      required:
        - email
        - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        twoFactorCode:
          type:
            - 'null'
            - string
        twoFactorRecoveryCode:
          type:
            - 'null'
            - string
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
    PublicClaimDto:
      required:
        - claimantName
        - quantityClaimed
      type: object
      properties:
        claimantName:
          type:
            - 'null'
            - string
        quantityClaimed:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        isMyClaim:
          type: boolean
          default: false
        revocationToken:
          type:
            - 'null'
            - string
          format: uuid
    PublicItemDto:
      required:
        - id
        - name
        - description
        - type
        - targetQuantity
        - orderNumber
        - totalClaimed
        - claims
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
            - 'null'
            - string
        type:
          $ref: '#/components/schemas/ItemType'
        targetQuantity:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        orderNumber:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        totalClaimed:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        claims:
          type: array
          items:
            $ref: '#/components/schemas/PublicClaimDto'
        isClaimedByCurrentUser:
          type: boolean
          default: false
    PublicListDto:
      required:
        - name
        - description
        - ownerDisplayName
        - items
      type: object
      properties:
        name:
          type: string
        description:
          type:
            - 'null'
            - string
        ownerDisplayName:
          type:
            - 'null'
            - string
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicItemDto'
    RefreshRequest:
      required:
        - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
    RegisterRequest:
      required:
        - email
        - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    ReorderItemsRequest:
      required:
        - itemIds
      type: object
      properties:
        itemIds:
          type: array
          items:
            type: string
            format: uuid
    ResendConfirmationEmailRequest:
      required:
        - email
      type: object
      properties:
        email:
          type: string
    ResetPasswordRequest:
      required:
        - email
        - resetCode
        - newPassword
      type: object
      properties:
        email:
          type: string
        resetCode:
          type: string
        newPassword:
          type: string
    TwoFactorRequest:
      type: object
      properties:
        enable:
          type:
            - 'null'
            - boolean
        twoFactorCode:
          type:
            - 'null'
            - string
        resetSharedKey:
          type: boolean
        resetRecoveryCodes:
          type: boolean
        forgetMachine:
          type: boolean
    TwoFactorResponse:
      required:
        - sharedKey
        - recoveryCodesLeft
        - isTwoFactorEnabled
        - isMachineRemembered
      type: object
      properties:
        sharedKey:
          type: string
        recoveryCodesLeft:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        recoveryCodes:
          type:
            - 'null'
            - array
          items:
            type: string
        isTwoFactorEnabled:
          type: boolean
        isMachineRemembered:
          type: boolean
    UpdateGiftListRequest:
      required:
        - name
        - description
      type: object
      properties:
        name:
          type: string
        description:
          type:
            - 'null'
            - string
    UpdateUserInfoRequest:
      required:
        - displayName
      type: object
      properties:
        displayName:
          type:
            - 'null'
            - string
    UpsertItemRequest:
      required:
        - name
        - description
        - type
        - targetQuantity
      type: object
      properties:
        name:
          type: string
        description:
          type:
            - 'null'
            - string
        type:
          $ref: '#/components/schemas/ItemType'
        targetQuantity:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
tags:
  - name: Auth
  - name: UserLists
  - name: Public