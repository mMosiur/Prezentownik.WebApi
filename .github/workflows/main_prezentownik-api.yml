# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - prezentownik-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Prezentownik.WebApi.slnx

      - name: Build solution
        run: dotnet build Prezentownik.WebApi.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Prezentownik.WebApi.slnx --configuration Release --no-build

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef

      - name: Create EF Core migration bundle
        run: dotnet ef migrations bundle --project src/Prezentownik.WebApi/Prezentownik.WebApi.csproj --startup-project src/Prezentownik.WebApi/Prezentownik.WebApi.csproj --configuration Release --self-contained -r linux-x64 -o ${{env.DOTNET_ROOT}}/bundle/efbundle

      - name: dotnet publish
        run: dotnet publish src/Prezentownik.WebApi/Prezentownik.WebApi.csproj --configuration Release --no-build -o ${{env.DOTNET_ROOT}}/prezentownik-api

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: prezentownik-api
          path: ${{env.DOTNET_ROOT}}/prezentownik-api

      - name: Upload migration bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: efbundle
          path: ${{env.DOTNET_ROOT}}/bundle/efbundle

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: prezentownik-api
      
      - name: Download migration bundle
        uses: actions/download-artifact@v4
        with:
          name: efbundle
          path: ./bundle

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5FD13B25FDED4CEBAC687C5965561674 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_76E69C89AD8D4E4FA9B6C6F4A08F2D82 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6C82ABBB991F4CB2A707F8CEAC85B11A }}

      - name: Apply database migrations
        run: |
          chmod +x ./bundle/efbundle
          
          CONNECTION_STRING="${{ secrets.DATABASE_CONNECTION_STRING }}"
          
          echo "::add-mask::$CONNECTION_STRING"
          ./bundle/efbundle --connection "$CONNECTION_STRING"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'prezentownik-api'
          slot-name: 'Production'
          package: .
          clean: true
